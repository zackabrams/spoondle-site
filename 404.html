<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Page not found · Spoondle</title>
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* This page can be served at any address, so everything it needs is here or linked from the site root. */
@font-face{font-family:"Rubik";font-weight:600;font-display:block;src:url(/fonts/rubik.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:radial-gradient(120% 90% at 30% 0%,#2c6247,#18503a 60%,#123f2d);color:#f2ead0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  box-shadow:inset 0 0 0 8px #5b361a,inset 0 0 0 9.5px #3b2210,inset 0 18px 26px rgba(0,0,0,.35)}
.note{position:fixed;left:0;right:0;bottom:max(12vh,calc(env(safe-area-inset-bottom) + 48px));display:grid;justify-items:center;gap:16px;padding:0 24px;text-align:center;pointer-events:none}
.brand{font:700 26px/1 Georgia,"Times New Roman",serif;letter-spacing:-1px;color:#f2ead0}
.brand span{color:#e2c173}
.note p{margin:0;color:#bccbb8;font-size:16px;text-wrap:balance}
.home{pointer-events:auto;display:inline-block;padding:12px 26px;border-radius:999px;background:#f2ead0;color:#1c5a40;font-weight:700;text-decoration:none;
  box-shadow:inset 0 0 0 3px #f2ead0,inset 0 0 0 4.5px rgba(28,90,64,.55),0 2px 4px rgba(0,0,0,.4)}
.tile{position:fixed;left:0;top:0;width:var(--s);height:var(--s);display:grid;place-items:center;border-radius:calc(var(--s)*.17);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  background:linear-gradient(165deg,#fff8e6,#f3e6c6 55%,#e2cfa2);color:#1f1a10;font:600 calc(var(--s)*.66)/1 "Rubik",ui-rounded,system-ui,sans-serif;text-shadow:0 1px 0 rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(150,120,70,.25),0 calc(var(--s)*.07) 0 #b39a66,0 calc(var(--s)*.12) calc(var(--s)*.22) rgba(0,0,0,.45);will-change:transform}
.tile.held{cursor:grabbing;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 calc(var(--s)*.07) 0 #b39a66,0 calc(var(--s)*.5) calc(var(--s)*.5) rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="note">
  <div class="brand">spoondle<span>.</span></div>
  <p>This page got swapped out. Toss the tiles around, or head back to the game.</p>
  <a class="home" href="/">Back to Spoondle</a>
</div>
<script>
// Three tiles on the felt. Drag and fling them; they slide, spin a little, bounce off the rail and each other.
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tiles = [...'404'].map((ch, i) => { const el = document.createElement('div'); el.className = 'tile'; el.textContent = ch; el.setAttribute('aria-hidden', 'true'); document.body.append(el); return { el, x: 0, y: 0, vx: 0, vy: 0, a: 0, va: 0, held: null }; });
let s = 0, W = 0, H = 0;
function layout(first) {
  W = innerWidth; H = innerHeight; s = Math.round(Math.min(120, W / 4.2, H / 4.6));
  document.documentElement.style.setProperty('--s', s + 'px');
  if (first) tiles.forEach((t, i) => { t.x = W / 2 + (i - 1) * s * 1.18; t.y = H * .36; t.a = (i - 1) * 5; });
}
layout(true); addEventListener('resize', () => layout(false));
// A little toss on arrival, so it's clear they move.
if (!still) tiles.forEach((t, i) => { t.vy = -6 - i; t.vx = (i - 1) * 3; t.va = (i - 1) * 1.6; });
let drag = null;
addEventListener('pointerdown', e => {
  const t = tiles.find(t => t.el === e.target); if (!t) return;
  e.preventDefault(); try { t.el.setPointerCapture(e.pointerId); } catch {} t.el.classList.add('held');
  drag = { t, dx: e.clientX - t.x, dy: e.clientY - t.y, lx: e.clientX, ly: e.clientY, lt: performance.now() };
  t.vx = t.vy = 0; t.held = true; tiles.forEach(o => o.el.style.zIndex = o === t ? 2 : 1);
});
addEventListener('pointermove', e => {
  if (!drag) return; const now = performance.now(), dt = Math.max(8, now - drag.lt), t = drag.t;
  // Remember how fast the finger was moving, so letting go throws the tile.
  t.vx = (e.clientX - drag.lx) / dt * 16; t.vy = (e.clientY - drag.ly) / dt * 16;
  t.x = e.clientX - drag.dx; t.y = e.clientY - drag.dy; drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
});
const drop = () => { if (!drag) return; drag.t.held = null; drag.t.el.classList.remove('held'); drag.t.va += drag.t.vx * .6; drag = null; };
addEventListener('pointerup', drop); addEventListener('pointercancel', drop);
let last = performance.now();
requestAnimationFrame(function step(now) {
  const k = Math.min(3, (now - last) / 16.7); last = now;
  const edge = s * .5 + 12;
  for (const t of tiles) {
    if (!t.held) {
      t.x += t.vx * k; t.y += t.vy * k; t.a += t.va * k;
      const f = Math.pow(still ? .8 : .93, k); t.vx *= f; t.vy *= f; t.va *= Math.pow(.9, k);
      // The rail: bounce back in, losing some speed.
      if (t.x < edge) { t.x = edge; t.vx = Math.abs(t.vx) * .6; } if (t.x > W - edge) { t.x = W - edge; t.vx = -Math.abs(t.vx) * .6; }
      if (t.y < edge) { t.y = edge; t.vy = Math.abs(t.vy) * .6; } if (t.y > H - edge) { t.y = H - edge; t.vy = -Math.abs(t.vy) * .6; }
    }
  }
  // Tiles knock into each other (treated as coins of the tile's width).
  for (let i = 0; i < tiles.length; i++) for (let j = i + 1; j < tiles.length; j++) {
    const p = tiles[i], q = tiles[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1, min = s * 1.02;
    if (d >= min) continue;
    const nx = dx / d, ny = dy / d, push = (min - d) / 2;
    if (!p.held) { p.x -= nx * push * (q.held ? 2 : 1); p.y -= ny * push * (q.held ? 2 : 1); }
    if (!q.held) { q.x += nx * push * (p.held ? 2 : 1); q.y += ny * push * (p.held ? 2 : 1); }
    const rel = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
    if (rel < 0) { const imp = -rel * .9; if (!p.held) { p.vx -= nx * imp; p.vy -= ny * imp; p.va -= imp * 1.5; } if (!q.held) { q.vx += nx * imp; q.vy += ny * imp; q.va += imp * 1.5; } }
  }
  for (const t of tiles) t.el.style.transform = `translate(${t.x - s / 2}px,${t.y - s / 2}px) rotate(${t.a}deg)`;
  requestAnimationFrame(step);
});
</script>
</body>
